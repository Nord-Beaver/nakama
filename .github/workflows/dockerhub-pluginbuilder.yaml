name: dockerhub-pluginbuilder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  nakama_dsym_build_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set env vars
        run: |
          echo "ARG_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: "build/pluginbuilder/Dockerfile"
          build-args: |
            VERSION=${{ inputs.version }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG }}/${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG }}-pluginbuilder
